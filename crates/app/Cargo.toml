[package]
name = "warble"
description = "Warble: a lightweight voice changer and soundboard for Discord and game chat."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
warble-engine.workspace = true
rune.workspace = true
rune-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
# The phone remote. httparse reads its requests (already here for ureq). qrcodegen draws the
# code a phone scans; it has no dependencies. png makes its home-screen icon (already built
# for Rune).
httparse = "1.10"
qrcodegen = "1.8"
png = "0.18"

# Both already in Rune's Windows build. rfd: the multi-file "Add sounds" picker (Rune's own
# picks one file). windows-sys: the window and taskbar icon, the title bar's colours, keeping to
# one running copy, the phone remote's secret key (the system's random numbers), and whether the
# push-to-talk key is down (GetAsyncKeyState, which only reads it).
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The sound search and downloads (Myinstants, Freesound, yt-dlp). A small blocking client. On
# Windows it uses the system's own TLS and certificates (schannel): rustls' crypto (ring) is C
# that can't be cross-checked from Linux.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
