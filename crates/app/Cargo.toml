[package]
name = "warble"
description = "Warble: a lightweight voice changer and soundboard for Discord and game chat."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
warble-engine.workspace = true
rune.workspace = true
rune-kit.workspace = true
serde.workspace = true
serde_json.workspace = true

# Both already in Rune's Windows build. rfd: the multi-file "Add sounds" picker (Rune's own
# picks one file). windows-sys: the window and taskbar icon, and keeping to one running copy.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# The sound search and downloads (Myinstants, Freesound, yt-dlp). A small blocking client. On
# Windows it uses the system's own TLS and certificates (schannel): rustls' crypto (ring) is C
# that can't be cross-checked from Linux.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
