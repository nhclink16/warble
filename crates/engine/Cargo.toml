[package]
name = "warble-engine"
description = "Warble's audio engine: mic in, voice effects and soundboard, out to a virtual cable and your headphones."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
warble-dsp.workspace = true
cpal.workspace = true
rtrb.workspace = true
symphonia.workspace = true

# Raise the audio threads to real-time priority (MMCSS "Pro Audio") so a game maxing out the CPU
# doesn't make the call audio crackle. Off, cpal leaves them at normal priority on Windows.
[target.'cfg(windows)'.dependencies]
cpal = { workspace = true, features = ["realtime"] }
