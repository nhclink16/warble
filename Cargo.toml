[workspace]
resolver = "3"
members = ["crates/dsp", "crates/engine", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
warble-dsp = { path = "crates/dsp" }
warble-engine = { path = "crates/engine" }
cpal = "0.18.2"
rtrb = "0.4.1"
symphonia = { version = "0.6.1", features = ["mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rune is pre-release: pinned to a rev of its `dev` branch and bumped deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "1ad9cf69a22c86e9803b257220eae8ee6456c9ce", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "1ad9cf69a22c86e9803b257220eae8ee6456c9ce" }

# DSP and the renderer are too slow unoptimised to judge by ear, even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.warble-dsp]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
